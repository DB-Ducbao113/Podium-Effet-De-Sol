    <path d="M510 353 L625 308 L1045 305 L1138 360 L1014 388 L620 385 Z" fill="#132637" stroke="#00f0ff" stroke-opacity=".4" stroke-width="3"/>
    <path d="M645 358 Q784 320 984 355" fill="none" stroke="#ff3028" stroke-width="7"/>
